name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # the optional extras: Pillow for the clip/cinematic engine,
      # numpy+imageio for the small clip path. The plugin core is
      # stdlib-only and tests/test_deps.py proves that in a subprocess
      # where these imports are hard-blocked.
      - name: Install test extras
        run: python -m pip install --quiet pillow numpy imageio
      - name: Run the suite
        run: |
          set -o pipefail
          python -m unittest discover tests 2>&1 | tee /tmp/out.log
          status=$?
          if [ $status -ne 0 ]; then
            echo "### Suite output tail" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -c 6000 /tmp/out.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              printf '::error::%s\n' "${line:0:600}"
            done < <(tail -c 3000 /tmp/out.log)
          fi
          exit $status
      - name: Publish failure log as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 6000 /tmp/out.log > /tmp/tail.log || true
          echo "job: ${{ matrix.python }}" >> /tmp/tail.log
          jq -Rs '{body: ("CI failure tail (auto, for debugging):\n\n```\n" + . + "\n```")}' /tmp/tail.log > /tmp/body.json
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d @/tmp/body.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            > /dev/null
